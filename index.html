<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Site web de Pokemon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Site web de Pokemon</h1>

<div class="pokedex">
<div class="card">
<img src="./images/pikachu.png" alt="Pikachu photo">
<p class="name">Pikachu</p>
<p class="hp">PV : 35</p>
<p class="type">Type : Electrik</p>
</div>

<div class="card">
<img src="./images/evoli.jpeg" alt="Evoli photo">
<p class="name">Evoli</p>
<p class="hp">PV : 55</p>
<p class="type">Type : Normal</p>
</div>

<div class="card">
<img src="./images/bulbizarre.png" alt="Bulbizarre">
<p class="name">Bulbizarre</p>
<p class="hp">PV : 45</p>
<p class="type">Type : Plante, Poison</p>
</div>

<div class="card">
<img src="./images/salameche.png" alt="Salamèche">
<p class="name">Salamèche</p>
<p class="hp">PV : 39</p>
<p class="type">Type : Feu</p>
</div>
</div>
<p class="update-date">Dernière mise à jour : 07/09/2026</p>
</body>
</html>
